<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Eloy Ávalos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
  --paper: #EAF6FB;
  --ink: #000000;
  --ink-soft: #33475B;
  --accent: #0B2D4D;
  --line: #BFE0EF;
    --maxw: 680px;
  }
  * { box-sizing: border-box; }
  body{ margin:0; background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; line-height: 1.6; font-size: 14px; }
  h1, h2 { font-family: 'Source Serif 4', Georgia, serif; }
  .wrap{ max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
  nav{background: #0B2D4D; border-bottom: 1px solid #0B2D4D; padding: 18px 0;}
  nav .wrap{ display:flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  nav a{color: #FFFFFF; text-decoration: none; margin-right: 18px; font-size: 15px;}
  nav a:hover{color: #EAF6FB;}
  nav .brand{font-family: 'Source Serif 4', serif; font-weight: 600; color: #FFFFFF; font-size: 17px;}
  header.hero{ padding: 56px 0 40px; }
  .hero-row{ display:flex; gap: 28px; align-items:flex-start; }
  .hero img{ width: 128px; height: 128px; border-radius: 6px; object-fit: top; flex-shrink:0; }
  h1{ font-size: 32px; font-weight: 600; margin: 0 0 4px; }
  .role{ color: var(--accent); font-weight: 500; margin: 0 0 16px; font-size: 16px; }
  .bio{ font-size: 16px; color: var(--ink-soft); }
